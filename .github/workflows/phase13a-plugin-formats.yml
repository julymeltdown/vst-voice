name: Phase 13A plug-in formats, validators, and installer smoke

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'apps/**'
      - 'libs/**'
      - 'phase13a/**'
      - 'packaging/**'
      - 'scripts/build_phase13a_formats.py'
      - 'scripts/attach_phase13a_validation.py'
      - 'scripts/verify_phase13a_vst3_packet.py'
      - 'scripts/fetch_phase13a_dependencies.py'
      - 'scripts/assemble_release_payload.py'
      - 'scripts/verify_release_dependency_closure.py'
      - 'scripts/verify_release_payload_manifest.py'
      - 'scripts/create_development_installer_handoff.py'
      - 'scripts/build_windows_installer.ps1'
      - 'scripts/package_macos_plugins.sh'
      - 'tools/phase13a/**'
      - 'tests/phase13a/**'
      - '.github/workflows/phase13a-plugin-formats.yml'

permissions:
  contents: read

env:
  CLAP_COMMIT: 195b42a004144fab0b3cf95e9c067187d15365b7
  CLAP_WRAPPER_COMMIT: 35f524b771ec09f54c164720bb90f271273b37d3
  VST3SDK_COMMIT: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
  AUDIOUNITSDK_COMMIT: bd98b31feff57a15989fcfab4cd86dc63382b1ac
  OPENSSL_COMMIT: 8cf17aaeb4599f8af87fefd810b5b5fee90fe69e
  NSIS_VERSION: '3.12'

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests/phase13a -v
      - run: python3 scripts/verify_phase13a_contracts.py --root .
      - run: python3 tools/phase13a/release_gate.py check --matrix docs/phase13a/mandatory-validation-matrix.json --gate G4 --expect-blocked

  linux-development-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libsqlite3-dev libssl-dev
      - name: Build canonical CLAP
        run: |
          cmake -S . -B build/linux-development -DCMAKE_BUILD_TYPE=Release -DSEAM_BUILD_BENCHMARKS=OFF
          cmake --build build/linux-development --target seam_clap_editor_plugin --parallel 2
      - name: Create deterministic unsigned developer package
        run: |
          version="$(python3 tools/phase13a/release_identity.py --source-root . --field version)"
          python3 tools/phase13a/developer_package.py \
            --clap build/linux-development/ProjectSEAMEditor.clap \
            --resources build/linux-development/ProjectSEAMEditor.resources \
            --output "out/ProjectSEAM-${version}-unsigned-development.zip" \
            --version "$version"
      - name: Install and uninstall in isolated sandbox
        run: |
          version="$(python3 tools/phase13a/release_identity.py --source-root . --field version)"
          python3 tools/phase13a/linux_package_smoke.py \
            --package "out/ProjectSEAM-${version}-unsigned-development.zip" \
            --sandbox out/linux-install-sandbox \
            --output out/linux-install-smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase13a-linux-development-package
          path: out

  vst3:
    name: ${{ matrix.os }} VST3 build and vst3-validator
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxinerama-dev libxcursor-dev libxrandr-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libgtk-3-dev libgtkmm-3.0-dev libsqlite3-dev libssl-dev
      - name: Acquire exact audited SDK checkouts
        shell: bash
        run: python3 scripts/fetch_phase13a_dependencies.py --output "$RUNNER_TEMP/phase13a-deps"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Verify exact dependency revisions
        shell: bash
        run: python3 scripts/fetch_phase13a_dependencies.py --output "$RUNNER_TEMP/phase13a-deps" --verify-only
      - name: Build canonical CLAP and VST3 wrapper
        shell: bash
        run: >-
          python3 scripts/build_phase13a_formats.py
          --source-root "$GITHUB_WORKSPACE"
          --dependencies "$RUNNER_TEMP/phase13a-deps"
          --build-root "$RUNNER_TEMP/phase13a-build"
          --configuration Release
      - name: Build Steinberg vst3-validator
        shell: bash
        run: |
          cmake -S "$RUNNER_TEMP/phase13a-deps/vst3sdk" -B "$RUNNER_TEMP/vst3sdk-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DSMTG_ADD_VST3_PLUGINS_SAMPLES=OFF \
            -DSMTG_ADD_VST3_HOSTING_SAMPLES=ON \
            -DSMTG_CREATE_PLUGIN_LINK=OFF
          cmake --build "$RUNNER_TEMP/vst3sdk-build" --config Release --target validator --parallel 2
      - name: Run vst3-validator and preserve raw log
        shell: bash
        run: |
          validator="$(find "$RUNNER_TEMP/vst3sdk-build" -type f \( -name validator -o -name validator.exe \) | head -1)"
          plugin="$(find "$RUNNER_TEMP/phase13a-build/artifacts" -maxdepth 7 -name '*.vst3' | head -1)"
          test -n "$validator" && test -n "$plugin"
          clap_sha="$(PYTHONPATH="$GITHUB_WORKSPACE/tools/phase13a" python3 -c 'import sys; from pathlib import Path; from distribution_manifest import tree_sha256; print(tree_sha256(Path(sys.argv[1])))' "$RUNNER_TEMP/phase13a-build/artifacts/CLAP/ProjectSEAMEditor.clap")"
          python3 scripts/run_vst3_validator.py --validator "$validator" --plugin "$plugin" --clap-path "$RUNNER_TEMP/phase13a-build/artifacts/CLAP" --canonical-clap-sha256 "$clap_sha" --output "out/phase13a/${{ runner.os }}/vst3-validator"
      - name: Attach validator result to the existing build manifest
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/phase13a-build/phase13a-build-result.json"
          python3 scripts/attach_phase13a_validation.py \
            --build-result "$RUNNER_TEMP/phase13a-build/phase13a-build-result.json" \
            --vst3-validation-result "out/phase13a/${{ runner.os }}/vst3-validator/result.json"
      - name: Stage stable artifact layout
        if: always()
        shell: bash
        run: |
          rm -rf out/phase13a/payload
          mkdir -p out/phase13a/payload
          if test -d "$RUNNER_TEMP/phase13a-build/artifacts"; then cp -R "$RUNNER_TEMP/phase13a-build/artifacts/." out/phase13a/payload/; fi
          if test -f "$RUNNER_TEMP/phase13a-build/phase13a-build-result.json"; then cp "$RUNNER_TEMP/phase13a-build/phase13a-build-result.json" out/phase13a/; fi
          mkdir -p "out/phase13a/${{ runner.os }}/vst3-validator"
          validator="$(find "$RUNNER_TEMP/vst3sdk-build" -type f \( -name validator -o -name validator.exe \) | head -1)"
          test -n "$validator"
          cp "$validator" "out/phase13a/${{ runner.os }}/vst3-validator/validator"
          python3 - <<'PY'
          import json
          import os
          import platform

          payload = {
              "runnerOs": platform.system(),
              "runnerRelease": platform.release(),
              "runnerArchitecture": platform.machine(),
              "githubRunnerImage": os.environ.get("ImageOS", ""),
          }
          with open("out/phase13a/${{ runner.os }}/runner.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          plugin="$(find out/phase13a/payload -maxdepth 7 -name '*.vst3' -print -quit)"
          test -n "$plugin"
          python3 scripts/verify_phase13a_vst3_packet.py \
            --create \
            --root out/phase13a \
            --packet "out/phase13a/${{ runner.os }}/vst3-validator/packet.json" \
            --result "out/phase13a/${{ runner.os }}/vst3-validator/result.json" \
            --stdout-log "out/phase13a/${{ runner.os }}/vst3-validator/validator.log" \
            --stderr-log "out/phase13a/${{ runner.os }}/vst3-validator/validator.stderr.log" \
            --plugin "$plugin" \
            --clap out/phase13a/payload/CLAP/ProjectSEAMEditor.clap \
            --validator "out/phase13a/${{ runner.os }}/vst3-validator/validator" \
            --runner-metadata "out/phase13a/${{ runner.os }}/runner.json" \
            --build-result out/phase13a/phase13a-build-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase13a-vst3-${{ runner.os }}
          path: |
            out/phase13a/payload
            out/phase13a/${{ runner.os }}/vst3-validator
            out/phase13a/${{ runner.os }}/runner.json
            out/phase13a/phase13a-build-result.json

  auv2:
    name: macOS AUv2 build and auval
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Acquire exact audited SDK checkouts
        run: python3 scripts/fetch_phase13a_dependencies.py --output "$RUNNER_TEMP/phase13a-deps"
      - name: Build canonical CLAP and AUv2 wrapper
        run: >-
          python3 scripts/build_phase13a_formats.py
          --source-root "$GITHUB_WORKSPACE"
          --dependencies "$RUNNER_TEMP/phase13a-deps"
          --build-root "$RUNNER_TEMP/phase13a-build"
          --configuration Release
          --auv2
      - name: Install AUv2 into isolated user component location
        run: |
          component="$(find "$RUNNER_TEMP/phase13a-build/artifacts" -maxdepth 7 -name '*.component' -type d | head -1)"
          test -n "$component"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/ProjectSEAMEditor.component"
          ditto "$component" "$HOME/Library/Audio/Plug-Ins/Components/ProjectSEAMEditor.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
      - name: Run auval and preserve raw log
        run: python3 scripts/run_auval.py --type aumu --subtype SEAM --manufacturer PSEM --output out/phase13a/macos/auval
      - name: Attach auval result to the existing build manifest
        if: always()
        run: |
          test -f "$RUNNER_TEMP/phase13a-build/phase13a-build-result.json"
          python3 scripts/attach_phase13a_validation.py \
            --build-result "$RUNNER_TEMP/phase13a-build/phase13a-build-result.json" \
            --auval-validation-result out/phase13a/macos/auval/result.json
      - name: Stage stable macOS artifact layout
        if: always()
        run: |
          rm -rf out/phase13a/payload
          mkdir -p out/phase13a/payload
          if test -d "$RUNNER_TEMP/phase13a-build/artifacts"; then
            cp -R "$RUNNER_TEMP/phase13a-build/artifacts/." out/phase13a/payload/
            tar -C out/phase13a -czf out/phase13a/payload-macos.tar.gz payload
          fi
          if test -f "$RUNNER_TEMP/phase13a-build/phase13a-build-result.json"; then cp "$RUNNER_TEMP/phase13a-build/phase13a-build-result.json" out/phase13a/; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase13a-auv2-macos
          path: |
            out/phase13a/payload-macos.tar.gz
            out/phase13a/macos/auval
            out/phase13a/phase13a-build-result.json

  windows-installer-smoke:
    needs: vst3
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/download-artifact@v4
        with:
          name: phase13a-vst3-Windows
          path: ${{ runner.temp }}\phase13a-payload
      - name: Install exact NSIS build tool
        shell: powershell
        run: choco install nsis --version $env:NSIS_VERSION --no-progress -y
      - name: Create development-only uninstaller signing identity
        shell: powershell
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Project SEAM Development Test' -CertStoreLocation Cert:\CurrentUser\My
          Export-Certificate -Cert $cert -FilePath "$env:RUNNER_TEMP\project-seam-development.cer" | Out-Null
          Import-Certificate -FilePath "$env:RUNNER_TEMP\project-seam-development.cer" -CertStoreLocation Cert:\CurrentUser\Root | Out-Null
          "WINDOWS_DEVELOPMENT_SIGN_CERT_SHA1=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Locate downloaded payload and build unsigned installer
        shell: powershell
        run: |
          $payload = Get-ChildItem "$env:RUNNER_TEMP\phase13a-payload" -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName 'CLAP\ProjectSEAMEditor.clap') } | Select-Object -First 1
          if (-not $payload) { throw 'Downloaded Windows payload root was not found' }
          $version = (& python tools/phase13a/release_identity.py --source-root . --field version).Trim()
          ./scripts/build_windows_installer.ps1 -PayloadRoot $payload.FullName -OutputInstaller "$env:RUNNER_TEMP\ProjectSEAM-$version-unsigned.exe" -DevelopmentSignUninstaller
      - name: Clean install, same-version reinstall, and uninstall
        shell: powershell
        run: |
          $version = (& python tools/phase13a/release_identity.py --source-root . --field version).Trim()
          $payload = Get-ChildItem "$env:RUNNER_TEMP\phase13a-payload" -Directory -Recurse | Where-Object { Test-Path (Join-Path $_.FullName 'Tools\seam_installer_verifier.exe') } | Select-Object -First 1
          if (-not $payload) { throw 'Downloaded Windows verifier payload root was not found' }
          ./scripts/test_windows_installer.ps1 -Installer "$env:RUNNER_TEMP\ProjectSEAM-$version-unsigned.exe" -EvidenceDirectory out\phase13a\windows\installer-clean -Verifier (Join-Path $payload.FullName 'Tools\seam_installer_verifier.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: phase13a-windows-unsigned-installer-smoke
          path: |
            ${{ runner.temp }}\ProjectSEAM-*-unsigned.exe
            out/phase13a/windows/installer-clean

  macos-installer-smoke:
    needs: auv2
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: phase13a-auv2-macos
          path: ${{ runner.temp }}/phase13a-payload
      - name: Extract mode-preserving macOS payload
        run: |
          archive="$(find "$RUNNER_TEMP/phase13a-payload" -type f -name payload-macos.tar.gz -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP/phase13a-payload"
      - name: Locate downloaded payload and build unsigned PKG
        run: |
          payload="$(find "$RUNNER_TEMP/phase13a-payload" -type d -name CLAP -print | head -1 | xargs dirname)"
          test -n "$payload" && test -e "$payload/CLAP/ProjectSEAMEditor.clap"
          mach_o_count=0
          while IFS= read -r -d '' binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              test -x "$binary"
              mach_o_count=$((mach_o_count + 1))
            fi
          done < <(find "$payload/Standalone" "$payload/CLAP" "$payload/VST3" "$payload/AU" "$payload/Tools" -type f -print0)
          test "$mach_o_count" -ge 5
          version="$(python3 tools/phase13a/release_identity.py --source-root . --field version)"
          bash scripts/package_macos_plugins.sh "$payload" "$RUNNER_TEMP/ProjectSEAM-${version}-unsigned.pkg" --unsigned
      - name: Clean install, same-version reinstall, and uninstall
        run: |
          payload="$(find "$RUNNER_TEMP/phase13a-payload" -type d -name CLAP -print | head -1 | xargs dirname)"
          test -x "$payload/Tools/seam_installer_verifier"
          version="$(python3 tools/phase13a/release_identity.py --source-root . --field version)"
          bash scripts/test_macos_installer.sh "$RUNNER_TEMP/ProjectSEAM-${version}-unsigned.pkg" out/phase13a/macos/installer-clean "$payload/Tools/seam_installer_verifier"
      - uses: actions/upload-artifact@v4
        with:
          name: phase13a-macos-unsigned-installer-smoke
          path: |
            ${{ runner.temp }}/ProjectSEAM-*-unsigned.pkg
            out/phase13a/macos/installer-clean
