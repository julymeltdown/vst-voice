name: project-seam-ci

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  native-platform-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install native build dependencies on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libx11-dev xvfb fonts-noto-cjk
      - name: Install OpenSSL 3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install openssl --no-progress -y
      - name: Install OpenSSL 3 on macOS
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $roots = @(
            "C:\Program Files\OpenSSL-Win64",
            "C:\Program Files\OpenSSL"
          )
          $root = $roots | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $root) { throw "OpenSSL 3 installation root was not found" }
          cmake -S . -B build/ci -DSEAM_BUILD_TESTS=ON -DSEAM_BUILD_BENCHMARKS=OFF -DSEAM_WARNINGS_AS_ERRORS=ON -DOPENSSL_ROOT_DIR="$root" -DSEAM_RUN_NATIVE_GUI_TESTS=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build/ci -DSEAM_BUILD_TESTS=ON -DSEAM_BUILD_BENCHMARKS=OFF -DSEAM_WARNINGS_AS_ERRORS=ON -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" -DSEAM_RUN_NATIVE_GUI_TESTS=ON
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build/ci -DSEAM_BUILD_TESTS=ON -DSEAM_BUILD_BENCHMARKS=OFF -DSEAM_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build/ci --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build/ci -C Debug --output-on-failure
      - name: Platform source contract
        run: python scripts/verify_phase8_platform_sources.py --root .
      - name: Master-only and license audit
        shell: bash
        run: |
          python scripts/verify_master_branch.py --root .
          python tools/license-auditor/audit.py --root .
